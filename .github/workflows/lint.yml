name: lint

# Dogfoods actions-lint.yml against this repo's own workflow files.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/actions-lint.yml
